name: 'Agentic Testing Action'

description: 'Run tests and report results'
author: 'TestZeus'

inputs:
  token:
    description: 'TestZeus PocketBase JWT (preferred over email/password)'
    required: false
    default: ''
  email:
    description: 'TestZeus login email (fallback when token is not set)'
    required: false
    default: ''
  password:
    description: 'TestZeus login password (fallback when token is not set)'
    required: false
    default: ''
  name:
    description: 'Name for the test run group'
    required: false
    default: 'Smoke action suite'
  execution_mode:
    description: 'Execution mode for the test run (lenient or strict)'
    required: false
    default: 'lenient'
  filename:
    description: 'Filename for the CTRF report output'
    required: false
    default: 'ctrf-report.json'
  notification_channels:
    description: 'Notification channels ids for the test run eg: "1234567890,1234567891"'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Run TestZeus create-execute
      shell: bash
      env:
        TESTZEUS_TOKEN: ${{ inputs.token }}
        TESTZEUS_EMAIL: ${{ inputs.email }}
        TESTZEUS_PASSWORD: ${{ inputs.password }}
        TEST_RUN_NAME: ${{ inputs.name }}
        EXECUTION_MODE: ${{ inputs.execution_mode }}
        REPORT_FILENAME: ${{ inputs.filename }}
        NOTIFICATION_CHANNELS: ${{ inputs.notification_channels }}
      run: |
        chmod +x "${{ github.action_path }}/scripts/entrypoint.sh"
        "${{ github.action_path }}/scripts/entrypoint.sh"
