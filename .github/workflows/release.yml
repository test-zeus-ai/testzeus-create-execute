name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/test-zeus-ai/testzeus-create-execute

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse version
        id: version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          # v1.2.3 -> major=v1
          MAJOR="$(echo "$TAG" | sed -E 's/^(v[0-9]+).*/\1/')"
          echo "major=${MAJOR}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push pipe image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bitbucket-pipe/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.major }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          body: |
            ## Distribution

            - **GitHub Action:** `test-zeus-ai/testzeus-create-execute@${{ steps.version.outputs.tag }}` (or `@${{ steps.version.outputs.major }}`)
            - **Bitbucket Pipe image:** `${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}` (also `:latest` and `:${{ steps.version.outputs.major }}`)
            - **GitLab / Bitbucket scripts:** set `TESTZEUS_ACTION_REF=${{ steps.version.outputs.tag }}` (default templates use `v1`)

            Prefer `TESTZEUS_TOKEN` over email/password in CI.

            ### Floating tags move

            Publishing this release **moves** the floating major tag `@${{ steps.version.outputs.major }}` / image `:${{ steps.version.outputs.major }}` and `:latest` to this build. Consumers pinned only to `@v1` / `:v1` pick up this release on the next run. Pin a full semver (`@${{ steps.version.outputs.tag }}`) if you need a freeze.
